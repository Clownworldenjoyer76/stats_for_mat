# docs/win/basketball/config/markets.yaml

# selection_mode:
#    pick_one = if both sides pass, keep only one
#    all_qualifying = keep every side that passes

# pick_preference: { metric: XX, direction: XX }
#     metric options:
#       ev
#       kelly
#       model_prob
#       edge_vs_market
#     direction options:
#        max [highest value]
#        min [lowest value]

pick_preference: { metric: model_prob, direction: max }


ml_vs_spread_tiebreak: ev
# ml_vs_spread_tiebreak options:
#   ev
#   kelly
#   edge_vs_market

markets:

#########################################################################################################################################################
#########################################################################################################################################################
######################################              NBA                                   ###############################################################
#########################################################################################################################################################
#########################################################################################################################################################

  nba:

    moneyline:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        odds_bands:           [[-1000, 1000]]
        ev_bands:             [[0.0001, 1.00]]
        kelly_bands:          [[0.0001, 1.00]]
        model_prob_bands:     [[0.4, 1.0]]
        edge_vs_market_bands: [[-100.0, 100.0]]
        months:               []
        exclude_days_of_week: []

      away:
        enabled: true
        odds_bands:           [[-1000, 1000]]
        ev_bands:             [[0.0001, 1.00]]
        kelly_bands:          [[0.0001, 1.00]]
        model_prob_bands:     [[0.4, 1.0]]
        edge_vs_market_bands: [[-100.0, 100.0]]
        months:               []
        exclude_days_of_week: []

###  NBA SPREAD  ######################################################################################################################
  
    spread:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      home:
        enabled: true
        line_bands:           [[-50.0, 50]]
        odds_bands:           [[-1000, 1000]]
        ev_bands:             [[0.0001, 1.00]]
        kelly_bands:          [[0.0001, 1.00]]
        model_prob_bands:     [[0.3, 0.70]]
        edge_vs_market_bands: [[-100.0, 100.0]]
        months:               []
        exclude_days_of_week: []

      away:
        enabled: true
        line_bands:           [[-50.0, 50]]
        odds_bands:           [[-1000, 1000]]
        ev_bands:             [[0.0001, 1.00]]
        kelly_bands:          [[0.0001, 1.00]]
        model_prob_bands:     [[0.3, 0.70]]
        edge_vs_market_bands: [[-100.0, 100.0]]
        months:               []
        exclude_days_of_week: []

###  NBA TOTAL  ######################################################################################################################

    total:
      enabled: true
      selection_mode: pick_one
      pick_preference: { metric: model_prob, direction: max }

      over:
        enabled: true
