schema_version: 1
feature_version: sdv_model_v2_advanced_candidate_v1

advanced_features:
  promotion_status: candidate_not_promoted
  production_feature_version: sdv_model_v1_pit_v2
  candidate_history_output_root: docs/win/basketball/00_intake/sdv/features/advanced_candidate/history
  candidate_current_output_root: docs/win/basketball/00_intake/sdv/features/advanced_candidate/current
  windows: [5, 10, 20]
  lineup:
    source_table: lineups.parquet
    missing_policy: explicit_null
  possessions:
    source_table: possessions.parquet
    missing_policy: explicit_null
  shots:
    source_table: shots.parquet
    missing_policy: explicit_null
  tracking:
    enabled: false
    real_source: null
    missing_policy: explicit_null
  player_impact:
    enabled: false

paths:
  history_input_root: docs/win/basketball/00_intake/sdv/history
  history_output_root: docs/win/basketball/00_intake/sdv/features/history
  current_output_root: docs/win/basketball/00_intake/sdv/features/current
  canonical_current_root: docs/win/basketball/00_intake/sdv/canonical_games

feature_windows:
  team_games: [5, 10, 20]
  opponent_rating_games: 20
  player_team_games: 10
  player_top_n: 8
  venue_history_games: 50

shrinkage:
  team_pseudo_games: 3.0
  opponent_pseudo_games: 5.0
  player_pseudo_games: 2.0

possessions:
  prefer_sdv: true

  sdv_method:
    id: sdv_possession_rows_divided_by_two
    definition: Count valid possession rows for a game and divide by 2 to obtain per-team game possessions.
    count_as_possession_policy: When count_as_possession exists and is populated, count only true rows; otherwise count all possession rows.

  fallback_estimate:
    id: averaged_team_boxscore_estimate
    free_throw_coefficient: 0.44
    formula: 0.5 * ((FGA - ORB + TOV + 0.44 * FTA)_team + (FGA - ORB + TOV + 0.44 * FTA)_opponent)

  validation:
    min_team_possessions: 30.0
    max_team_possessions: 160.0

formulas:
  offensive_efficiency: 100 * points_for / possessions
  defensive_efficiency: 100 * points_against / possessions
  efg_pct: (FGM + 0.5 * 3PM) / FGA
  turnover_rate: TOV / possessions
  offensive_rebound_rate: ORB / (ORB + opponent_DRB)
  free_throw_rate: FTA / FGA
  pace: per-team game possessions
  rest_days: max(calendar_day_difference_from_previous_game - 1, 0)
  opponent_adjusted_offense: raw_off_eff - (opponent_prior_def_eff - prior_league_efficiency)
  opponent_adjusted_defense: raw_def_eff - (opponent_prior_off_eff - prior_league_efficiency)
  differential: home_feature - away_feature
  recent_form: recent window mean shrunk toward the same team's all-prior mean using team_pseudo_games

player_strength:
  definition: Prior player_game.parquet rows only; select recent participants by prior minutes and shrink each player toward the prior team-player baseline.

  weights:
    points: 1.0
    rebounds: 0.4
    assists: 0.7
    steals: 1.0
    blocks: 1.0
    turnovers: -1.0

point_in_time:
  strict_before_target: true
  allow_same_day_only_with_earlier_timestamp: true
  abort_on_target_game_id_in_source_slice: true
  roster_availability_from_season_roster_forbidden: true
  target_boxscore_forbidden: true
  target_pbp_forbidden: true
  target_possessions_forbidden: true
  target_shots_forbidden: true
  target_final_score_forbidden: true
  future_games_forbidden: true

venue_context:
  neutral_site_column: is_neutral_site
  home_court_indicator_column: home_court_indicator
  away_court_indicator_column: away_court_indicator
  venue_id_column: venue_id
  neutral_home_court_value: 0
  neutral_away_court_value: 0
  fixed_point_home_court_adjustment: null
  derive_home_court_from_home_team_field_only: false

training:
  model_version: sdv_model_v1
  model_type: ridge_linear

  targets:
    margin: actual_home_points - actual_away_points
    total: actual_home_points + actual_away_points

  ridge_alpha: 10.0

  lockbox:
    policy: latest_internal_season
    read_during_training: false
    use_for_residual_distribution: false

  oos:
    method: expanding_window
    folds: 5
    minimum_training_date_fraction: 0.50

  residual_distribution:
    family: normal
    source: expanding_window_oos_only

  probability:
    moneyline:
      definition: P(actual_margin > 0)

    spread:
      home_line_convention: home spread is added to actual home margin; for example -3.5 means home must win by more than 3.5
      home_definition: P(actual_margin + home_spread_line > 0)
      away_definition: 1 - home_spread_prob

    total:
      over_definition: P(actual_total > total_line)
      under_definition: 1 - over_prob

  evaluation_output_root: docs/win/basketball/errors/99_validation/sdv_model_v1

  production:
    write_models: false
    overwrite_dratings: false

artifacts:
  schema_version: 1
  enabled: true
  root: docs/win/basketball/models/sdv
  persistence_mode: evaluation_candidate
  overwrite_dratings: false
  require_feature_version_match: true
  require_model_version_match: true
  sportsdataverse_config: docs/win/basketball/config/sdv_storage.yaml

