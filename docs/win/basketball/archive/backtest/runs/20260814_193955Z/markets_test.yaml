# docs/win/basketball/config/markets.yaml

# selection_mode:
#    pick_one = if both sides pass, keep only one
#    all_qualifying = keep every side that passes

# pick_preference: { metric: XX, direction: XX }
#     metric options:
#       ev
#       kelly
#       model_prob
#       edge_vs_market
#     direction options:
#        max [highest value]
#        min [lowest value]

pick_preference: { metric: model_prob, direction: max }

stake_sizing:
  kelly_fraction: 0.25
  kelly_cap: 0.05

ml_vs_spread_tiebreak: ev
# ml_vs_spread_tiebreak options:
#   ev
#   kelly
#   edge_vs_market

