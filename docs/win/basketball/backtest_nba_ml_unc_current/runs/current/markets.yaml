# docs/win/basketball/markets.yaml

# DEVELOPMENT / ANALYSIS CONFIGURATION
#
# Purpose:
#   Keep market-level filtering as permissive as possible while the underlying
#   basketball model, calibration, SDV features, and probability generation
#   are being developed and validated.
#
# selection_mode:
#   pick_one       = if both sides pass, keep only one
#   all_qualifying = keep every side that passes
#
# During model development, all_qualifying is preferred so the analysis retains
# both sides whenever both pass the upstream requirements.
#
# pick_preference:
#   Only matters when selection_mode = pick_one.
#
#   metric options:
#     ev
#     kelly
#     model_prob
#     edge_vs_market
#
#   direction options:
#     max
#     min

pick_preference: { metric: model_prob, direction: max }


# NOTE:
# This setting can still eliminate one market when both moneyline and spread
# qualify on the same game. The currently supported options are:
#   ev
#   kelly
#   edge_vs_market
#
# Leave as kelly until/unless the selector is changed to support disabling
# this cross-market tiebreak entirely.
ml_vs_spread_tiebreak: kelly


