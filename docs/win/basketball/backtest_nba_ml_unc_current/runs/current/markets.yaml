# docs/win/basketball/markets.yaml explanation
#
# Per-league × per-market × per-side filter configuration.
#
# DEVELOPMENT PURPOSE:
#   These settings are intentionally wide-open. The goal is to prevent
#   markets.yaml from imposing narrow historical bucket optimizations while
#   the underlying model is still being developed.
#
#   The research/backtest data should retain as much of the available market
#   population as possible so performance can later be analyzed by:
#     - model probability
#     - EV
#     - Kelly
#     - edge vs market
#     - odds
#     - spread/total line
#     - side
#     - league
#     - date/time buckets
#
# Filter structure (each side):
#
#   odds_bands
#     American-odds ranges that are allowed.
#     Wide-open development range:
#       [-100000, 100000]
#
#   line_bands
#     Spread/total ranges that are allowed.
#     Spread development range:
#       [-100, 100]
#     Total development range:
#       [0, 500]
#
#   ev_bands
#     Model expected-value ranges in decimal form.
#     Example:
#       0.02 = +2% EV
#
#     Development range:
#       [-1.00, 100.00]
#
#     This intentionally does NOT use markets.yaml to require positive EV.
#     Any upstream model-level qualification rules still apply separately.
#
#   kelly_bands
#     Raw Kelly fraction.
#
#     Development range:
#       [0.00, 1.00]
#
#   model_prob_bands
#     Model probability in decimal form.
#
#     Development range:
#       [0.00, 1.00]
#
#   edge_vs_market_bands
#     Model probability edge versus devigged market probability,
#     expressed in percentage points.
#
#     Development range:
#       [-100.0, 100.0]
#
#
# Date filters per side:
#
#   months
#     List of month integers 1-12 to include.
#     [] = no month restriction.
#
#   exclude_days_of_week
#     List of weekdays to skip:
#       Monday    = 0
#       Tuesday   = 1
#       Wednesday = 2
#       Thursday  = 3
#       Friday    = 4
#       Saturday  = 5
#       Sunday    = 6
#
#     [] = no weekday restriction.
#
#
# Per-market:
#
#   selection_mode
#
#     pick_one
#       If both sides qualify, retain only one according to pick_preference.
#
#     all_qualifying
#       Retain every side that passes.
#
#     Development configuration uses:
#       all_qualifying
#
#     This prevents side-selection logic from prematurely removing observations
#     that are useful for model evaluation.
#
#
#   pick_preference.metric
#
#     Supported:
#       ev
#       kelly
#       model_prob
#       edge_vs_market
#
#   pick_preference.direction
#
#     Supported:
#       max
#       min
#
#   pick_preference remains configured even though it does not control
#   all_qualifying mode. This preserves a valid value if a market is later
#   switched back to pick_one.
#
#
# Top-level stake sizing:
#
#   stake_sizing.kelly_fraction
#     Multiplier applied to raw Kelly.
#
#     Current:
#       0.25 = quarter Kelly
#
#   stake_sizing.kelly_cap
#     Maximum stake as a fraction of bankroll.
#
#     Current:
#       0.05 = 5%
#
#
# ml_vs_spread_tiebreak:
#
#   When both moneyline and spread qualify on the same game, the current
#   selector can keep only one of those markets.
#
#   Supported tiebreak metrics:
#     ev
#     kelly
#     edge_vs_market
#
#   Current:
#     kelly
#
#   This is NOT being treated as a model-development filter here because the
#   existing configuration interface does not document a disabled/none option.
#   If complete preservation of simultaneous moneyline + spread candidates is
#   desired, that behavior should be changed in the selector itself rather than
#   inventing an unsupported markets.yaml value.
