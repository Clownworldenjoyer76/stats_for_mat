####################################################################################################################
# WARNING: Do not store sensitive information in this file, as its contents will be included in the Qodana report. #
####################################################################################################################

version: "1.0"
linter: qodana-python

profile:
  name: qodana.recommended

bootstrap: |
  python -m pip install --upgrade pip==26.2.1
  python -m pip install -r docs/win/basketball/requirements.txt

include:
  - name: CheckDependencyLicenses

exclude:
  - name: PyClassHasNoInitInspection
dependencyOverrides:
  - name: pip
    version: "26.2.1"
    licenses:
      - key: MIT
