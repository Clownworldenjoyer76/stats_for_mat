name: MLB model training

on:
  workflow_dispatch:
    inputs:
      measure_impact:
        description: Recompute feature_impact.csv after training
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mlb-model
  cancel-in-progress: false

env:
  SCRIPT_DIR: docs/win/baseball/mlb/scripts
  HF_REPO: Clownworldenjoyer76/baseball_projector
  HF_DOWNLOAD_DIR: docs/win/baseball/mlb
  DATA_DIR: docs/win/baseball/mlb/baseball_projector
  MODEL_DIR: docs/win/baseball/mlb/model

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          python -m pip install -r docs/win/baseball/mlb/requirements-mlb-model.txt

      - name: Download private historical MLB data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is missing."
            exit 1
          fi

          hf download "$HF_REPO" \
            --repo-type dataset \
            --local-dir "$HF_DOWNLOAD_DIR" \
            --token "$HF_TOKEN"

          if [ ! -d "$DATA_DIR" ]; then
            echo "::error::Expected dataset directory was not downloaded: $DATA_DIR"
            exit 1
          fi

      - name: Build raw-data registry
        run: |
          python "$SCRIPT_DIR/build_data_registry.py" \
            --data-dir "$DATA_DIR" \
            --out "$MODEL_DIR/raw_data_registry.csv"

      - name: Build historical features
        run: |
          python "$SCRIPT_DIR/build_full_features.py" \
            --data-dir "$DATA_DIR" \
            --out-dir "$MODEL_DIR"

      - name: Train and compare all models
        run: |
          python "$SCRIPT_DIR/train_all_models.py" \
            --features "$MODEL_DIR/full_features.csv" \
            --out-dir "$MODEL_DIR" \
            --profile quick \
            --max-features 250

      - name: Measure feature impact
        if: ${{ inputs.measure_impact }}
        run: |
          python "$SCRIPT_DIR/measure_feature_impact.py" \
            --features "$MODEL_DIR/full_features.csv" \
            --lineage "$MODEL_DIR/feature_lineage.csv" \
            --out-dir "$MODEL_DIR" \
            --models winner \
            --resume

      - name: Verify trained model exists
        run: |
          if [ ! -f "$MODEL_DIR/winning_model.joblib" ]; then
            echo "::error::Training did not create $MODEL_DIR/winning_model.joblib."
            exit 1
          fi

      - name: Upload training diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: mlb-model-diagnostics-${{ github.run_id }}
          path: |
            docs/win/baseball/mlb/model/model_*.csv
            docs/win/baseball/mlb/model/feature_*.csv
            docs/win/baseball/mlb/model/raw_data_registry.csv
            docs/win/baseball/mlb/model/model_manifest.json
            docs/win/baseball/mlb/model/model_skipped.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit trained model output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$MODEL_DIR/winning_model.joblib" \
            "$MODEL_DIR/model_manifest.json" \
            "$MODEL_DIR/model_leaderboard.csv" \
            "$MODEL_DIR/feature_lineage.csv" \
            "$MODEL_DIR/raw_data_registry.csv"

          if [ -f "$MODEL_DIR/feature_impact.csv" ]; then
            git add "$MODEL_DIR/feature_impact.csv"
          fi

          if git diff --cached --quiet; then
            echo "No changed training output to commit."
          else
            git commit -m "Update MLB trained model"
            git pull --rebase
            git push
          fi
