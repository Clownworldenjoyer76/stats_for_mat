name: MLB model training and prediction

on:
  workflow_dispatch:
    inputs:
      retrain:
        description: Rebuild historical features and retrain every model
        required: true
        type: boolean
        default: false

      measure_impact:
        description: Recompute feature_impact.csv after training
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mlb-model
  cancel-in-progress: false

env:
  SCRIPT_DIR: docs/win/baseball/mlb/scripts
  HF_REPO: Clownworldenjoyer76/baseball_projector
  HF_DOWNLOAD_DIR: docs/win/baseball/mlb
  DATA_DIR: docs/win/baseball/mlb/baseball_projector
  MODEL_DIR: model
  UPCOMING_CSV: model/upcoming_games.csv
  PREDICTION_DIR: docs/win/baseball/00_intake/predictions

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          python -m pip install -r requirements-mlb-model.txt

      - name: Download private historical MLB data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is missing."
            exit 1
          fi

          hf download "$HF_REPO" \
            --repo-type dataset \
            --local-dir "$HF_DOWNLOAD_DIR" \
            --token "$HF_TOKEN"

          if [ ! -d "$DATA_DIR" ]; then
            echo "::error::Expected dataset directory was not downloaded: $DATA_DIR"
            exit 1
          fi

      - name: Update current MLB data and upcoming-game input
        env:
          MLB_INTAKE_COMMAND: ${{ vars.MLB_INTAKE_COMMAND }}
        run: |
          if [ -n "$MLB_INTAKE_COMMAND" ]; then
            bash -lc "$MLB_INTAKE_COMMAND"
          fi

          if [ ! -f "$UPCOMING_CSV" ]; then
            echo "::error::$UPCOMING_CSV was not created. Set the repository variable MLB_INTAKE_COMMAND to the existing intake command that updates current data and writes this file."
            exit 1
          fi

      - name: Build raw-data registry
        if: ${{ inputs.retrain }}
        run: |
          python "$SCRIPT_DIR/build_data_registry.py" \
            --data-dir "$DATA_DIR" \
            --out "$MODEL_DIR/raw_data_registry.csv"

      - name: Build historical features
        if: ${{ inputs.retrain }}
        run: |
          python "$SCRIPT_DIR/build_full_features.py" \
            --data-dir "$DATA_DIR" \
            --out-dir "$MODEL_DIR"

      - name: Train and compare all models
        if: ${{ inputs.retrain }}
        run: |
          python "$SCRIPT_DIR/train_all_models.py" \
            --features "$MODEL_DIR/full_features.csv" \
            --out-dir "$MODEL_DIR" \
            --profile quick \
            --max-features 250

      - name: Measure feature impact
        if: ${{ inputs.retrain && inputs.measure_impact }}
        run: |
          python "$SCRIPT_DIR/measure_feature_impact.py" \
            --features "$MODEL_DIR/full_features.csv" \
            --lineage "$MODEL_DIR/feature_lineage.csv" \
            --out-dir "$MODEL_DIR" \
            --models winner \
            --resume

      - name: Verify trained model exists
        run: |
          if [ ! -f "$MODEL_DIR/winning_model.joblib" ]; then
            echo "::error::Run this workflow manually once with retrain=true."
            exit 1
          fi

      - name: Build upcoming-game features
        run: |
          python "$SCRIPT_DIR/build_full_features.py" \
            --data-dir "$DATA_DIR" \
            --out-dir "$MODEL_DIR" \
            --mode live \
            --upcoming-csv "$UPCOMING_CSV"

      - name: Predict upcoming games
        run: |
          GAME_DATE=$(TZ=America/New_York date +%F)
          PREDICTION_FILE="$PREDICTION_DIR/${GAME_DATE}_MLB.csv"

          python "$SCRIPT_DIR/train_all_models.py" \
            --predict-only \
            --features "$MODEL_DIR/live_features.csv" \
            --model "$MODEL_DIR/winning_model.joblib" \
            --prediction-output "$PREDICTION_FILE"

          echo "PREDICTION_FILE=$PREDICTION_FILE" >> "$GITHUB_ENV"

      - name: Upload training diagnostics
        if: ${{ inputs.retrain }}
        uses: actions/upload-artifact@v4
        with:
          name: mlb-model-diagnostics-${{ github.run_id }}
          path: |
            model/model_*.csv
            model/feature_*.csv
            model/raw_data_registry.csv
            model/model_manifest.json
            model/model_skipped.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit model and prediction output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PREDICTION_FILE"

          if [ "${{ inputs.retrain }}" = "true" ]; then
            git add \
              "$MODEL_DIR/winning_model.joblib" \
              "$MODEL_DIR/model_manifest.json" \
              "$MODEL_DIR/model_leaderboard.csv" \
              "$MODEL_DIR/feature_lineage.csv"

            if [ -f "$MODEL_DIR/feature_impact.csv" ]; then
              git add "$MODEL_DIR/feature_impact.csv"
            fi
          fi

          if git diff --cached --quiet; then
            echo "No changed output to commit."
          else
            git commit -m "Update MLB model output ${PREDICTION_FILE##*/}"
            git pull --rebase
            git push
          fi
