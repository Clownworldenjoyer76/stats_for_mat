name: Pipeline Basketball

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  basketball-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ensure output directories
        run: |
          mkdir -p docs/win/basketball/errors/01_merge

          mkdir -p docs/win/basketball/01_merge/nba/moneyline
          mkdir -p docs/win/basketball/01_merge/nba/spread
          mkdir -p docs/win/basketball/01_merge/nba/total

          mkdir -p docs/win/basketball/01_merge/ncaam/moneyline
          mkdir -p docs/win/basketball/01_merge/ncaam/spread
          mkdir -p docs/win/basketball/01_merge/ncaam/total

          mkdir -p docs/win/basketball/01_merge/wnba/moneyline
          mkdir -p docs/win/basketball/01_merge/wnba/spread
          mkdir -p docs/win/basketball/01_merge/wnba/total

          mkdir -p docs/win/basketball/01_merge/01_merguiced/nba/moneyline
          mkdir -p docs/win/basketball/01_merge/01_merguiced/nba/spread
          mkdir -p docs/win/basketball/01_merge/01_merguiced/nba/total

          mkdir -p docs/win/basketball/01_merge/01_merguiced/ncaam/moneyline
          mkdir -p docs/win/basketball/01_merge/01_merguiced/ncaam/spread
          mkdir -p docs/win/basketball/01_merge/01_merguiced/ncaam/total

          mkdir -p docs/win/basketball/01_merge/01_merguiced/wnba/moneyline
          mkdir -p docs/win/basketball/01_merge/01_merguiced/wnba/spread
          mkdir -p docs/win/basketball/01_merge/01_merguiced/wnba/total

          mkdir -p docs/win/basketball/errors/03_edges

          mkdir -p docs/win/basketball/03_edges/ev_kelly/nba/moneyline
          mkdir -p docs/win/basketball/03_edges/ev_kelly/nba/spread
          mkdir -p docs/win/basketball/03_edges/ev_kelly/nba/total

          mkdir -p docs/win/basketball/03_edges/ev_kelly/ncaam/moneyline
          mkdir -p docs/win/basketball/03_edges/ev_kelly/ncaam/spread
          mkdir -p docs/win/basketball/03_edges/ev_kelly/ncaam/total

          mkdir -p docs/win/basketball/03_edges/ev_kelly/wnba/moneyline
          mkdir -p docs/win/basketball/03_edges/ev_kelly/wnba/spread
          mkdir -p docs/win/basketball/03_edges/ev_kelly/wnba/total

          mkdir -p docs/win/basketball/errors/04_select
          mkdir -p docs/win/basketball/04_select/daily_slate
          mkdir -p docs/win/basketball/04_select/nba/daily_picks
          mkdir -p docs/win/basketball/04_select/ncaam/daily_picks
          mkdir -p docs/win/basketball/04_select/wnba/daily_picks

          mkdir -p docs/win/basketball/errors/05_final_scores

          mkdir -p docs/win/basketball/05_final_scores/results/nba/graded
          mkdir -p docs/win/basketball/05_final_scores/results/ncaam/graded
          mkdir -p docs/win/basketball/05_final_scores/results/wnba/graded

          mkdir -p docs/win/basketball/05_final_scores/reports/nba/moneyline
          mkdir -p docs/win/basketball/05_final_scores/reports/nba/spread
          mkdir -p docs/win/basketball/05_final_scores/reports/nba/total
          mkdir -p docs/win/basketball/05_final_scores/reports/nba/overview

          mkdir -p docs/win/basketball/05_final_scores/reports/ncaam/moneyline
          mkdir -p docs/win/basketball/05_final_scores/reports/ncaam/spread
          mkdir -p docs/win/basketball/05_final_scores/reports/ncaam/total
          mkdir -p docs/win/basketball/05_final_scores/reports/ncaam/overview

          mkdir -p docs/win/basketball/05_final_scores/reports/wnba/moneyline
          mkdir -p docs/win/basketball/05_final_scores/reports/wnba/spread
          mkdir -p docs/win/basketball/05_final_scores/reports/wnba/total
          mkdir -p docs/win/basketball/05_final_scores/reports/wnba/overview

          mkdir -p docs

      - name: Run merge intake
        run: python docs/win/basketball/scripts/01_merge/merge_intake.py

      - name: Run build juice files
        run: python docs/win/basketball/scripts/01_merge/build_juice_files.py

      - name: Run EV and Kelly
        run: python docs/win/basketball/scripts/03_edges/compute_ev_kelly.py

      - name: Run basketball bet selection
        run: python docs/win/basketball/scripts/04_select/basketball_select_bets.py

      - name: Run daily slate
        run: python docs/win/basketball/scripts/04_select/daily_slate.py

      - name: Grade basketball results
        run: python docs/win/basketball/scripts/05_final_scores/01_basketball_results_grade.py

      - name: Analyze basketball results
        run: python docs/win/basketball/scripts/05_final_scores/02_basketball_results_analyze.py

      - name: Build basketball reports
        run: python docs/win/basketball/scripts/05_final_scores/03_basketball_results_reports.py

      - name: Build basketball dashboard
        run: python docs/win/basketball/scripts/05_final_scores/04_basketball_results_dashboard.py

      - name: Show logs
        if: always()
        run: |
          echo "=== 01 Merge Logs ==="
          cat docs/win/basketball/errors/01_merge/merge_intake.txt || true
          cat docs/win/basketball/errors/01_merge/build_juice_files.txt || true

          echo ""
          echo "=== 03 Edges Logs ==="
          cat docs/win/basketball/errors/03_edges/compute_ev_kelly.txt || true

          echo ""
          echo "=== 04 Select Logs ==="
          cat docs/win/basketball/errors/04_select/select_bets.txt || true
          cat docs/win/basketball/errors/04_select/daily_slate.txt || true

          echo ""
          echo "=== 05 Final Scores Logs ==="
          cat docs/win/basketball/errors/05_final_scores/01_basketball_results_grade.txt || true

          echo ""
          echo "=== Basketball output files ==="
          find docs/win/basketball/01_merge -type f | sort || true
          find docs/win/basketball/03_edges -type f | sort || true
          find docs/win/basketball/04_select -type f | sort || true
          find docs/win/basketball/05_final_scores -type f | sort || true

      - name: Commit outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/basketball/01_merge/
          git add docs/win/basketball/03_edges/
          git add docs/win/basketball/04_select/
          git add docs/win/basketball/05_final_scores/
          git add docs/win/basketball/errors/
          git add docs/basketball_dashboard.html

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: run basketball 01-03-04-05 pipeline $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
