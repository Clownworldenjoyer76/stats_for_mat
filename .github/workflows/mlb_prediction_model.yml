name: MLB model prediction

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-model
  cancel-in-progress: false

env:
  SCRIPT_DIR: docs/win/baseball/mlb/scripts
  HF_REPO: Clownworldenjoyer76/baseball_projector
  HF_DOWNLOAD_DIR: docs/win/baseball/mlb
  DATA_DIR: docs/win/baseball/mlb/baseball_projector
  MODEL_DIR: docs/win/baseball/mlb/model
  UPCOMING_CSV: docs/win/baseball/mlb/model/upcoming_games.csv
  PREDICTION_DIR: docs/win/baseball/00_intake/predictions

jobs:
  prediction:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          python -m pip install -r docs/win/baseball/mlb/requirements-mlb-model.txt

      - name: Download private historical MLB data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::The HF_TOKEN repository secret is missing."
            exit 1
          fi

          hf download "$HF_REPO" \
            --repo-type dataset \
            --local-dir "$HF_DOWNLOAD_DIR" \
            --token "$HF_TOKEN"

          if [ ! -d "$DATA_DIR" ]; then
            echo "::error::Expected dataset directory was not downloaded: $DATA_DIR"
            exit 1
          fi

      - name: Update current MLB data and upcoming-game input
        env:
          MLB_INTAKE_COMMAND: ${{ vars.MLB_INTAKE_COMMAND }}
        run: |
          if [ -n "$MLB_INTAKE_COMMAND" ]; then
            bash -lc "$MLB_INTAKE_COMMAND"
          fi

          if [ ! -f "$UPCOMING_CSV" ]; then
            echo "::error::$UPCOMING_CSV was not created."
            exit 1
          fi

      - name: Verify trained model exists
        run: |
          if [ ! -f "$MODEL_DIR/winning_model.joblib" ]; then
            echo "::error::$MODEL_DIR/winning_model.joblib does not exist."
            exit 1
          fi

      - name: Build upcoming-game features
        run: |
          python "$SCRIPT_DIR/build_full_features.py" \
            --data-dir "$DATA_DIR" \
            --out-dir "$MODEL_DIR" \
            --mode live \
            --upcoming-csv "$UPCOMING_CSV"

      - name: Predict upcoming games
        run: |
          GAME_DATE=$(TZ=America/New_York date +%F)
          PREDICTION_FILE="$PREDICTION_DIR/${GAME_DATE}_MLB.csv"

          python "$SCRIPT_DIR/train_all_models.py" \
            --predict-only \
            --features "$MODEL_DIR/live_features.csv" \
            --model "$MODEL_DIR/winning_model.joblib" \
            --prediction-output "$PREDICTION_FILE"

          echo "PREDICTION_FILE=$PREDICTION_FILE" >> "$GITHUB_ENV"

      - name: Commit prediction output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "$PREDICTION_FILE"

          if git diff --cached --quiet; then
            echo "No changed prediction output to commit."
          else
            git commit -m "Update MLB prediction ${PREDICTION_FILE##*/}"
            git pull --rebase
            git push
          fi
