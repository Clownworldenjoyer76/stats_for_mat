name: Pipeline UFC

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify model files on main
        run: |
          test -f docs/win/mma/ufc/data/model/fighter_attributes.json
          test -f docs/win/mma/ufc/data/model/fighter_history.json
          test -f docs/win/mma/ufc/data/model/fighter_historical_stats.parquet
          test -f docs/win/mma/ufc/data/model/ufc_master_clean.parquet
          test -f docs/win/mma/ufc/data/model/ufc_model.pkl

          echo "Model files found on main:"
          ls -lh docs/win/mma/ufc/data/model/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --retries 5 pandas pyarrow numpy scikit-learn xgboost pyyaml playwright
          python -m playwright install --with-deps chromium

      - name: Create output directories
        run: |
          mkdir -p docs/win/mma/ufc/00_intake/sportsbook
          mkdir -p docs/win/mma/ufc/00_intake/predictions
          mkdir -p docs/win/mma/ufc/01_feature_engineering
          mkdir -p docs/win/mma/ufc/02_edges
          mkdir -p docs/win/mma/ufc/03_select
          mkdir -p docs/win/mma/ufc/03_select/detailed
          mkdir -p docs/win/mma/ufc/04_final/graded
          mkdir -p docs/win/mma/ufc/04_final/reports
          mkdir -p docs/win/mma/ufc/mappings

      - name: 00 - Normalize fighter names
        run: |
          python docs/win/mma/ufc/scripts/00_intake/00_name_normalization.py

      - name: 01 - Build features
        run: |
          python docs/win/mma/ufc/scripts/01_feature_engineering/01_build_features.py

      - name: 02 - Compute edges
        run: |
          python docs/win/mma/ufc/scripts/02_edges/02_edges.py

      - name: 03 - Select bets
        run: |
          python docs/win/mma/ufc/scripts/03_select/03_select.py

      - name: 04 - Grade bets
        run: |
          python docs/win/mma/ufc/scripts/04_final/ufc_grader.py

      - name: 04 - Generate reports
        run: |
          python docs/win/mma/ufc/scripts/04_final/ufc_reports.py

      - name: Show outputs
        if: always()
        run: |
          echo "=== UFC sportsbook inputs ==="
          find docs/win/mma/ufc/00_intake/sportsbook -maxdepth 1 -type f -name "*_ufc_odds.csv" | sort || true

          echo ""
          echo "=== UFC prediction inputs ==="
          find docs/win/mma/ufc/00_intake/predictions -maxdepth 1 -type f -name "*_ufc_predictions.csv" | sort || true

          echo ""
          echo "=== UFC feature outputs ==="
          find docs/win/mma/ufc/01_feature_engineering -maxdepth 1 -type f -name "*_ufc_features.csv" | sort || true

          echo ""
          echo "=== UFC edge outputs ==="
          find docs/win/mma/ufc/02_edges -maxdepth 1 -type f -name "*_ufc_edges.csv" | sort || true

          echo ""
          echo "=== UFC select outputs ==="
          find docs/win/mma/ufc/03_select -maxdepth 1 -type f -name "*_ufc_select.csv" | sort || true

          echo ""
          echo "=== UFC detailed select outputs ==="
          find docs/win/mma/ufc/03_select/detailed -maxdepth 1 -type f -name "*_ufc_select_detailed.csv" | sort || true

          echo ""
          echo "=== UFC graded outputs ==="
          find docs/win/mma/ufc/04_final/graded -maxdepth 1 -type f -name "*_ufc_graded.csv" | sort || true

          echo ""
          echo "=== UFC report outputs ==="
          find docs/win/mma/ufc/04_final/reports -type f | sort || true

      - name: Commit and push all output files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/win/mma/ufc/00_intake/sportsbook/*_ufc_odds.csv 2>/dev/null || true
          git add docs/win/mma/ufc/00_intake/predictions/*_ufc_predictions.csv 2>/dev/null || true
          git add docs/win/mma/ufc/mappings/no_map_fighter_name.csv 2>/dev/null || true
          git add docs/win/mma/ufc/01_feature_engineering/*_ufc_features.csv 2>/dev/null || true
          git add docs/win/mma/ufc/02_edges/*_ufc_edges.csv 2>/dev/null || true
          git add docs/win/mma/ufc/03_select/
          git add docs/win/mma/ufc/04_final/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: UFC full pipeline run $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin main
            git push origin main
          fi