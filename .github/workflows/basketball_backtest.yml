name: Basketball Backtest

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  basketball-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run basketball backtest
        run: |
          python docs/win/basketball/scripts/testing/basketball_backtest.py

      - name: Show backtest outputs
        if: always()
        run: |
          echo "=== BACKTEST reports ==="
          find docs/win/basketball/backtest/reports -type f | sort || true

          echo ""
          echo "=== BACKTEST selections ==="
          find docs/win/basketball/backtest/selections -type f | sort || true

          echo ""
          echo "=== BACKTEST graded ==="
          find docs/win/basketball/backtest/graded -type f | sort || true

          echo ""
          echo "=== BACKTEST runs ==="
          find docs/win/basketball/backtest/runs -type f | sort || true

      - name: Commit backtest outputs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A docs/win/basketball/backtest/

          echo "--- git status before commit ---"
          git status --short

          if git diff --cached --quiet; then
            echo "No backtest changes to commit."
            exit 0
          fi

          git commit -m "chore: basketball backtest $(date -u +'%Y-%m-%d %H:%M UTC')"

          git pull --rebase --autostash origin main
          git push
