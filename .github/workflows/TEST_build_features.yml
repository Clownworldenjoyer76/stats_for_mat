name: _TEST_build_features

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mlb-build-features
  cancel-in-progress: false

env:
  SCRIPT_DIR: docs/win/baseball/mlb/scripts
  HF_REPO: Clownworldenjoyer76/baseball_projector
  HF_DOWNLOAD_DIR: docs/win/baseball/mlb
  DATA_DIR: docs/win/baseball/mlb/baseball_projector
  MODEL_DIR: docs/win/baseball/mlb/model
  REQUIREMENTS_FILE: docs/win/baseball/mlb/requirements-mlb-model.txt

jobs:
  build-features:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/win/baseball/mlb/requirements-mlb-model.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install huggingface_hub
          python -m pip install -r "$REQUIREMENTS_FILE"

      - name: Download private historical MLB data
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN repository secret is missing."
            exit 1
          fi

          hf download "$HF_REPO" \
            --repo-type dataset \
            --local-dir "$HF_DOWNLOAD_DIR" \
            --token "$HF_TOKEN"

          if [ ! -d "$DATA_DIR" ]; then
            echo "::error::Expected data directory does not exist: $DATA_DIR"
            exit 1
          fi

      - name: Build historical features
        run: |
          mkdir -p "$MODEL_DIR"

          python "$SCRIPT_DIR/build_full_features.py" \
            --data-dir "$DATA_DIR" \
            --out-dir "$MODEL_DIR"

      - name: Verify output files
        run: |
          test -s "$MODEL_DIR/full_features.csv"
          test -s "$MODEL_DIR/feature_lineage.csv"

      - name: Commit feature files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            "$MODEL_DIR/full_features.csv" \
            "$MODEL_DIR/feature_lineage.csv"

          if [ -f "$MODEL_DIR/feature_manifest.json" ]; then
            git add "$MODEL_DIR/feature_manifest.json"
          fi

          if git diff --cached --quiet; then
            echo "No changed feature files to commit."
          else
            git commit -m "Build MLB historical features"
            git pull --rebase
            git push
          fi
