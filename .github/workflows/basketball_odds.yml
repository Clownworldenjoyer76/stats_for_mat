name: Basketball Odds

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  basketball-odds:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run basketball odds
        run: python docs/win/basketball/scripts/00_intake/basketball_odds.py

      - name: Commit and push odds files
        run: |
          git add docs/win/basketball/00_intake/sportsbook/sportsbook_cleaned/

          if git diff --cached --quiet; then
            echo "No odds file changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update basketball odds"
          git push
